name: Validate profile and portfolio
on:
  push:
    paths:
      - 'README.md'
      - 'README.de.md'
      - 'PORTFOLIO.md'
      - 'PORTFOLIO.de.md'
      - 'portfolio/**'
      - 'scripts/validate_portfolio.py'
      - '.github/workflows/validate-profile.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'README.de.md'
      - 'PORTFOLIO.md'
      - 'PORTFOLIO.de.md'
      - 'portfolio/**'
      - 'scripts/validate_portfolio.py'
      - '.github/workflows/validate-profile.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify portfolio metadata
        run: python scripts/validate_portfolio.py
